server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # 127.0.0.11 é o DNS interno do Docker, que resolve nomes de serviço
  # ("api") dentro de uma rede criada pelo compose. Configurável por
  # DNS_RESOLVER para quem rodar fora do Docker.
  resolver ${DNS_RESOLVER} valid=30s ipv6=off;

  # SPA: qualquer rota do react-router (ex: /ordens-servico/123) precisa
  # devolver o index.html - senão um F5 dentro do painel dá 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # O painel chama a API sempre em /api (ver BASE_URL em src/api/client.ts).
  # Em desenvolvimento quem resolve isso é o proxy do Vite, que remove o
  # prefixo antes de repassar; em produção o nginx precisa fazer o mesmo -
  # é o que faz o rewrite abaixo.
  #
  # API_URL é injetado no start pelo docker-entrypoint (ver Dockerfile), o
  # que permite usar a mesma imagem em ambientes diferentes.
  # location com expressão regular, e não prefixo: assim o caminho de
  # destino é montado explicitamente com $1, sem depender de "rewrite +
  # break" - combinação que, junto com proxy_pass em variável, deixava a
  # requisição escapar para o location "/" e voltar o index.html (ou 405,
  # no caso de POST) em vez de chegar na API.
  location ~ ^/api/(.*)$ {
    # O endereço da API vai numa variável de propósito. Com o host escrito
    # direto no proxy_pass, o nginx resolve o DNS uma única vez, no start, e
    # se recusa a subir enquanto o container da API não existir ("host not
    # found in upstream") - ou seja, reiniciar o painel antes da API deixaria
    # o painel fora do ar. Com variável, a resolução acontece a cada
    # requisição, usando o resolver declarado acima.
    set $api_url ${API_URL};
    proxy_pass $api_url/$1$is_args$args;

    # Necessários quando a API está atrás de HTTPS: sem SNI e sem o Host
    # correto, o certificado do destino não bate e a conexão é recusada.
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Upload de foto de OS tirada pelo celular passa por aqui.
    client_max_body_size 25m;
  }

  # Assets com hash no nome (gerados pelo Vite) podem ser cacheados para
  # sempre; o index.html nunca, senão o navegador continua servindo a
  # versão antiga do painel depois de um deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
}
